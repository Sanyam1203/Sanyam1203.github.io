name: Build, Verify & Deploy Saffire EV

on:
  push:
    branches:
      - main
      - geo-seo-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Static Site & Compile SEO/GEO Assets
        run: |
          python build.py

      - name: Run Pytest SEO/GEO Verification Suite
        run: |
          pytest tests/test_seo_geo.py -v

      - name: Run Schema & Link Validator
        run: |
          python _geo_seo/validate.py

      - name: Verify CNAME Preservation
        run: |
          test -f CNAME && grep -q "saffireev.com" CNAME || (echo "CNAME missing or invalid!" && exit 1)

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          cname: saffireev.com

